version: '3.8'

# =====================================================================
# CivicConnect Local Engineering Environment & Data Layer
# Standard: DEC-005 (Docker Parity) & FEC-004 (Environment Parity)
# Author: Chris Fourie (602826)
# =====================================================================

services:
  # 1. Primary PostgreSQL Relational Database Service (NFR-001, NFR-007, FEC-003)
  postgres:
    image: postgres:16-alpine
    container_name: civicconnect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-civicconnect_db}
      POSTGRES_USER: ${DB_USER:-civic_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-civic_dev_secret_2026}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-civic_admin} -d ${DB_NAME:-civicconnect_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - civicconnect-network

  # 2. Database Administration Dashboard (Optional UI Inspection)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: civicconnect-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@civicconnect.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin_dev_pass_2026}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - civicconnect-network

volumes:
  postgres_data:
    driver: local

networks:
  civicconnect-network:
    driver: bridge
